---
name: Build

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shortcut: [el9, el10, el9s, el10s]
        yarn-install: [true, false]
        include:
          - name: almalinux-9
            shortcut: el9
            container-name: almalinux9
          - name: almalinux-10
            shortcut: el10
            container-name: almalinux10
          - name: centos-stream-9
            shortcut: el9s
            container-name: el9stream
          - name: centos-stream-10
            shortcut: el10s
            container-name: el10stream

    name: Build on ${{ matrix.name }}${{ matrix.yarn-install && ' (online yarn)' || '' }}
    container:
      image: quay.io/ovirt/buildcontainer:${{ matrix.container-name }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Mark repository as safe
        run: git config --global --add safe.directory "$(pwd)"

      - name: Install dependencies (offline build)
        if: ${{ !matrix.yarn-install }}
        run: dnf install -y autoconf automake gettext-devel git jq make rpm-build ovirt-engine-nodejs-modules

      - name: Install dependencies (online build)
        if: ${{ matrix.yarn-install }}
        run: |
          dnf install -y autoconf automake gettext-devel git jq make rpm-build nodejs
          dnf config-manager --add-repo https://dl.yarnpkg.com/rpm/yarn.repo
          dnf install -y --disablerepo='*' --enablerepo='yarn*' yarn

      - name: Set up nodejs path
        if: ${{ !matrix.yarn-install }}
        run: echo "/usr/share/ovirt-engine-nodejs-modules/bin" >> $GITHUB_PATH

      - name: Set build environment
        run: |
          TAG=$(git tag --points-at HEAD | head -1)
          if [[ -n "$TAG" ]]; then
            if [[ "$TAG" =~ -([0-9]+)$ ]]; then
              echo "PACKAGE_RPM_RELEASE=${BASH_REMATCH[1]}" >> $GITHUB_ENV
            else
              echo "PACKAGE_RPM_RELEASE=1" >> $GITHUB_ENV
            fi
          else
            echo "RELEASE_SUFFIX=.$(date --utc +%Y%m%d%H%M%S).git$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          fi

      - name: Autogen
        run: ./autogen.sh

      - name: Configure
        run: ./configure

      - name: Run eslint
        if: ${{ matrix.yarn-install }}
        run: |
          yarn install
          yarn eslint

      - name: Build RPM
        run: make -j rpm
        env:
          OFFLINE_BUILD: ${{ matrix.yarn-install && '0' || '1' }}

      - name: Collect artifacts
        run: |
          mkdir -p exported-artifacts
          find tmp.repos -iname \*rpm -exec mv "{}" exported-artifacts/ \;
          mv ./*tar.gz exported-artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ matrix.shortcut }}${{ matrix.yarn-install && '-yarn' || '' }}
          path: exported-artifacts

  publish-rpms:
    permissions:
      artifact-metadata: read
    needs: build
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ovirt/ovirt-workflows/.github/workflows/publish-rpms.yml@main
    secrets: inherit
